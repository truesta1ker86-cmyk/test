name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Сначала ставим зависимости (это обновит package-lock.json, если нужно)
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Тесты: вместо ng test пишем npx ng test
      - name: Test
        run: npx ng test --watch=false

      # Сборка: тоже через npx
      - name: Build
        run: npx ng build --configuration=production
