<app-icons-sprite></app-icons-sprite>

<div class="layout" [class.collapsed]="isSidebarCollapsed" [class.menu-open]="mobileMenu">
  <!-- SIDEBAR -->
  <aside class="sidebar" aria-label="Навигация">
    <div class="sidebar-head">
      <div class="logo">
        <div class="logo-mark">O1</div>
        <div class="logo-text">Маркетплейс ↔ 1С<small>Интеграция</small></div>
      </div>
      <button
        class="sidebar-collapse"
        id="sidebarCollapse"
        type="button"
        [attr.aria-label]="isSidebarCollapsed ? 'Развернуть боковое меню' : 'Свернуть боковое меню'"
        [attr.aria-expanded]="!isSidebarCollapsed"
        data-sidebar-tooltip="Свернуть боковое меню"
        (click)="toggleSidebarCollapsed()"
        [attr.title]="isSidebarCollapsed ? 'Развернуть боковое меню' : 'Свернуть боковое меню'"
      >
        <svg class="icon-sm" aria-hidden="true">
          <!-- Динамическая иконка или разворот CSS-стилями -->
          <use href="#i-panel-toggle"></use>
        </svg>
      </button>
    </div>

    <app-navigation
      [collapsed]="isSidebarCollapsed && !mobileMenu"
      (navigated)="closeMenu()"
    ></app-navigation>
    <a
      class="sidebar-profile"
      routerLink="/account"
      [queryParams]="{ tab: 'profile' }"
      aria-label="Открыть личный кабинет"
      (click)="closeMenu()"
    >
      <span class="profile-avatar" aria-hidden="true">ЛК</span>
      <span class="profile-copy"
        ><strong>Личный кабинет</strong><small>Настройки и доступ</small></span
      >
    </a>
  </aside>

  @if (mobileMenu) {
    <button
      type="button"
      class="menu-scrim"
      aria-label="Закрыть меню"
      (click)="closeMenu()"
    ></button>
  }
  <!-- MAIN -->
  <div class="main">
    <div class="main-head">
      <div class="main-head-leading">
        <button
          class="mobile-burger"
          type="button"
          aria-label="Открыть меню"
          [attr.aria-expanded]="mobileMenu"
          (click)="mobileMenu = !mobileMenu"
        >
          <svg class="icon-sm"><use href="#i-menu"></use></svg>
        </button>
      </div>
      <div class="main-head-right">
        <div id="pageActions"></div>
        <a
          routerLink="/account"
          [queryParams]="{ tab: 'shops' }"
          class="button"
          aria-label="Открыть управление магазинами"
          >Магазины</a
        >
      </div>
    </div>

    <main
      id="main-content"
      class="page-content"
      [attr.aria-label]="currentTitle"
      appProductHoverPreview
    >
      <ng-content></ng-content>
    </main>
  </div>
</div>
