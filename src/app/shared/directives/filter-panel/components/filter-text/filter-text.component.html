<div class="filter-control" [class.has-error]="!!error" [class.disabled]="disabled">
  <label *ngIf="showLabel" class="filter-label" [for]="key">
    {{ getDisplayLabel() }}
    <span class="required" *ngIf="filterConfig?.validation">*</span>
  </label>

  <input
    *ngIf="!multiline"
    pInputText
    [attr.aria-label]="getDisplayLabel()"
    [id]="key"
    [placeholder]="getPlaceholder()"
    [ngModelOptions]="{ standalone: true }"
    [(ngModel)]="value"
    (ngModelChange)="updateValue($event)"
    [disabled]="disabled"
    [readOnly]="readOnly"
    [class.ng-invalid]="!!error"
    [class.ng-dirty]="!!error"
    [style]="{ width: '100%' }"
  />
  <textarea
    *ngIf="multiline"
    pInputText
    [id]="key"
    [attr.aria-label]="getDisplayLabel()"
    [placeholder]="getPlaceholder()"
    [ngModelOptions]="{ standalone: true }"
    [(ngModel)]="value"
    (ngModelChange)="updateValue($event)"
    [disabled]="disabled"
    rows="3"
    [style]="{ width: '100%' }"
  ></textarea>

  <small *ngIf="error" class="p-error">{{ error }}</small>
</div>
