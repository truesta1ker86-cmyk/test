<div class="filter-control" 
     [class.has-error]="!!error" 
     [class.disabled]="disabled">
  
  <label *ngIf="showLabel" class="filter-label" [for]="key">
    {{ getDisplayLabel() }}
    <span class="required" *ngIf="filterConfig?.validation">*</span>
  </label>
  
  <p-datepicker 
    [id]="key"
    [(ngModel)]="value"
    (ngModelChange)="updateValue($event)"
    [placeholder]="getPlaceholder() || 'Выберите дату...'"
    [disabled]="disabled"
    [dateFormat]="dateFormat"
    [showIcon]="true"
    [showButtonBar]="true"
    [style]="{ width: '100%' }"
    [class.ng-invalid]="!!error"
    [minDate]="minDate"
    [maxDate]="maxDate"
  ></p-datepicker>
  
  <small *ngIf="error" class="p-error">{{ error }}</small>
</div>
