<button
  type="button"
  class="column-filter-trigger"
  [class.active]="!!rule()"
  [attr.aria-label]="'Фильтр: ' + label()"
  [attr.title]="'Фильтр: ' + label()"
  aria-haspopup="dialog"
  (click)="open()"
>
  <app-icon name="filter" />
</button>
@if (opened()) {
  <dialog
    #dialog
    appModalFocus
    class="finance-column-dialog"
    [attr.aria-label]="'Фильтр столбца: ' + label()"
    (cancel)="$event.preventDefault(); opened.set(false)"
    (modalEscape)="opened.set(false)"
  >
    <header>
      <strong>{{ label() }}</strong
      ><button type="button" aria-label="Закрыть фильтр столбца" (click)="opened.set(false)">
        ×
      </button>
    </header>
    <app-filter-select key="operator" />
    <app-filter-text key="text" />
    @if (numeric()) {
      <div class="bounds"><app-filter-text key="min" /><app-filter-text key="max" /></div>
    }
    <div class="choices-actions">
      <button type="button" (click)="filters.updateFilter('values', allValues())">
        Выбрать все
      </button>
      <button type="button" (click)="filters.updateFilter('values', [])">Снять все</button>
    </div>
    <app-filter-multiselect key="values" />
    @if (error()) {
      <p role="alert">{{ error() }}</p>
    }
    <footer>
      <button type="button" class="button" (click)="reset()">Сбросить</button
      ><button type="button" class="button primary" (click)="apply()">Применить</button>
    </footer>
  </dialog>
}
