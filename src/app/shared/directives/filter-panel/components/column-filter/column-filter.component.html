<button
  type="button"
  class="column-filter-trigger"
  [class.active]="!!rule()"
  [attr.aria-label]="'Фильтр: ' + label()"
  [attr.title]="'Фильтр: ' + label()"
  aria-haspopup="dialog"
  (click)="open()"
>
  <span aria-hidden="true">▾</span>
</button>
@if (opened()) {
  <dialog
    #dialog
    appModalFocus
    class="finance-column-dialog"
    [attr.aria-label]="'Фильтр столбца: ' + label()"
    (cancel)="$event.preventDefault(); opened.set(false)"
    (modalEscape)="opened.set(false)"
  >
    <header>
      <strong>{{ label() }}</strong
      ><button type="button" aria-label="Закрыть фильтр столбца" (click)="opened.set(false)">
        ×
      </button>
    </header>
    <app-filter-select key="operator" />
    <app-filter-text key="text" />
    @if (numeric()) {
      <div class="bounds"><app-filter-text key="min" /><app-filter-text key="max" /></div>
    }
    @if (remoteOptions()) {
      <div class="choices-actions">
        <app-filter-text key="choice_search" />
        <button type="button" class="button" [disabled]="optionsBusy()" (click)="requestValues()">
          Найти значения
        </button>
      </div>
    }
    <div class="choices-actions">
      <button
        type="button"
        (click)="filters.updateFilter('values', remoteOptions() ? null : allValues())"
      >
        {{ remoteOptions() ? 'Все значения без ограничения' : 'Выбрать все' }}
      </button>
      <button type="button" (click)="filters.updateFilter('values', [])">Снять все</button>
    </div>
    @if (optionsBusy()) {
      <app-preloader label="Загрузка значений…" />
    } @else if (optionsError()) {
      <p role="alert">{{ optionsError() }}</p>
      <button type="button" class="button" (click)="requestValues(valuesPage())">Повторить</button>
    } @else {
      <app-filter-multiselect key="values" />
    }
    @if (remoteOptions()) {
      <div class="choices-actions" aria-label="Страницы значений фильтра">
        <span>Найдено {{ optionsTotal() }} · страница {{ valuesPage() }}</span>
        <button
          type="button"
          [disabled]="optionsBusy() || valuesPage() <= 1"
          (click)="requestValues(valuesPage() - 1)"
        >
          Назад
        </button>
        <button
          type="button"
          [disabled]="optionsBusy() || !optionsHasMore()"
          (click)="requestValues(valuesPage() + 1)"
        >
          Далее
        </button>
      </div>
    }
    @if (error()) {
      <p role="alert">{{ error() }}</p>
    }
    <footer>
      <button type="button" class="button" (click)="reset()">Сбросить</button
      ><button
        type="button"
        class="button primary"
        [disabled]="remoteOptions() && (optionsBusy() || !!optionsError())"
        (click)="apply()"
      >
        Применить
      </button>
    </footer>
  </dialog>
}
