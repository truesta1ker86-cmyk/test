<p-table
  [value]="items"
  [columns]="columns"
  [lazy]="lazy"
  [totalRecords]="totalRecords"
  [loading]="isLoading"
  [rows]="rows"
  [paginator]="paginator" 
  [first]="first"
  (onLazyLoad)="onLazyLoad($event)"
  [selection]="selection"
  [selectionMode]="selectionMode"
  (selectionChange)="onSelectionChange($event)"
  [dataKey]="dataKey"
  [sortField]="sortField"
  [sortOrder]="sortOrder"
  [scrollable]="scrollable"
  [scrollHeight]="scrollHeight"
  [tableStyle]="{ 'min-width': '100%', 'table-layout': 'fixed' }"
  [showCurrentPageReport]="showCurrentPageReport"
  [currentPageReportTemplate]="currentPageReportTemplate"
  [tableStyleClass]="tableStyleClass"
  appTableColumnHover
  styleClass="custom-table"
>
  <ng-template #header>
    <ng-container *ngIf="headerTemplate; else defaultHeader">
      <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
    </ng-container>

    <ng-template #defaultHeader>
      <tr>
        <th *ngFor="let col of columns; trackBy: trackColumn">{{ col.header }}</th>
      </tr>
    </ng-template>
  </ng-template>

  <ng-template #body let-rowData let-rowIndex="rowIndex">
    <tr [pSelectableRow]="rowData">
      <td *ngFor="let col of columns; let i = index; trackBy: trackColumn">
        
        <ng-container *ngIf="hasCellTemplate(col); else defaultCell">
          <ng-template 
            [ngTemplateOutlet]="cellTemplate" 
            [ngTemplateOutletContext]="{ 
              $implicit: rowData, 
              row: rowData, 
              rowIndex: rowIndex, 
              column: col, 
              value: getValue(rowData, col.field) 
            }">
          </ng-template>
        </ng-container>

        <ng-template #defaultCell>
          {{ getValue(rowData, col.field) }}
        </ng-template>

      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td [attr.colspan]="columns.length">
        <div class="empty-message">{{ emptyMessage }}</div>
      </td>
    </tr>
  </ng-template>
</p-table>
