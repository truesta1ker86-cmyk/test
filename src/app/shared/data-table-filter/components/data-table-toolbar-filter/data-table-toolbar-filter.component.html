<form class="operational-filters filter-bar" [class.compact]="compact" (ngSubmit)="applyFilter()">
  @if (lifecycles.length) {
    <app-filter-select
      key="lifecycle"
      label="Жизненный цикл"
      [options]="lifecycles"
      [(ngModel)]="lifecycle"
      name="lifecycle"
      (userChange)="status = ''; applyFilter()"
    />
  }
  @if (statuses.length) {
    <app-filter-select
      key="status"
      label="Статус"
      [options]="statuses"
      [(ngModel)]="status"
      name="status"
      (userChange)="applyFilter()"
    />
  }
  @if (schemes.length) {
    <app-filter-select
      key="scheme"
      label="Схема"
      [options]="schemes"
      [(ngModel)]="scheme"
      name="scheme"
      (userChange)="applyFilter()"
    />
  }
  <app-filter-text
    [showLabel]="!compact"
    key="search"
    [label]="searchLabel"
    [placeholder]="searchPlaceholder"
    [(ngModel)]="search"
    name="search"
  />
  @if (sorts.length) {
    <app-filter-select
      key="sort"
      label="Порядок"
      [options]="sorts"
      [(ngModel)]="sort"
      name="sort"
      (userChange)="applyFilter()"
    />
  }
  <button class="button primary" type="submit" [disabled]="loading" [attr.aria-busy]="loading">
    Применить
  </button>
  <button class="button" type="button" (click)="resetFilter()">Сбросить</button>
</form>
