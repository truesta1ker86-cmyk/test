<div
  class="skeleton-cards"
  role="status"
  aria-live="polite"
  aria-label="Загрузка карточек"
  [style.--min-width.px]="minWidth()"
>
  @for (card of array(count()); track $index) {
    <article class="skeleton-card">
      @if (withImage()) {
        <p-skeleton width="100%" height="140px" borderRadius="0" />
      }

      <div class="skeleton-card__body">
        <p-skeleton width="70%" height="14px" borderRadius="6px" />
        <p-skeleton width="40%" height="10px" borderRadius="4px" />
        <div class="skeleton-card__meta">
          <p-skeleton width="60px" height="20px" borderRadius="4px" />
          <p-skeleton width="60px" height="20px" borderRadius="4px" />
        </div>
      </div>
    </article>
  }
</div>
