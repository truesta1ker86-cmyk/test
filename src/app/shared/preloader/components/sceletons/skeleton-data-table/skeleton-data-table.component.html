<div class="skeleton-data-table" role="status" aria-live="polite" aria-label="Загрузка таблицы">
  <div class="skeleton-data-table__head">
    @if (withCheckbox()) {
      <p-skeleton width="16px" height="16px" borderRadius="4px" />
    }
    @for (col of array(columns()); track $index) {
      <p-skeleton width="100%" height="12px" borderRadius="6px" />
    }
  </div>

  <div class="skeleton-data-table__body">
    @for (row of array(rows()); track $index) {
      <div class="skeleton-data-table__row">
        @if (withCheckbox()) {
          <p-skeleton width="16px" height="16px" borderRadius="4px" />
        }
        @for (col of array(columns()); track $index) {
          <p-skeleton
            width="{{ $index === 0 ? '80%' : '100%' }}"
            height="10px"
            borderRadius="4px"
          />
        }
      </div>
    }
  </div>
</div>
