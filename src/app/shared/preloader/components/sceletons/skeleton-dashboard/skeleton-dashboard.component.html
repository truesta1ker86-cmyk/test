<div class="skeleton-dashboard" role="status" aria-live="polite" aria-label="Загрузка дашборда">
  <!-- Метрики -->
  <div class="skeleton-dashboard__metrics">
    @for (m of array(metrics()); track $index) {
      <div class="skeleton-metric">
        <p-skeleton width="90px" height="11px" borderRadius="4px" />
        <p-skeleton width="140px" height="26px" borderRadius="6px" />
        <p-skeleton width="60%" height="10px" borderRadius="4px" />
      </div>
    }
  </div>

  <!-- График -->
  @if (withChart()) {
    <div class="skeleton-dashboard__chart">
      <p-skeleton width="180px" height="14px" borderRadius="6px" />
      <p-skeleton width="100%" height="220px" borderRadius="12px" />
    </div>
  }

  <!-- Таблица -->
  @if (withTable()) {
    <div class="skeleton-dashboard__table">
      <p-skeleton width="140px" height="14px" borderRadius="6px" />
      <div class="skeleton-dashboard__table-body">
        @for (row of array(6); track $index) {
          <div class="skeleton-dashboard__table-row">
            <p-skeleton width="100%" height="10px" borderRadius="4px" />
            <p-skeleton width="80%" height="10px" borderRadius="4px" />
            <p-skeleton width="60%" height="10px" borderRadius="4px" />
            <p-skeleton width="70%" height="10px" borderRadius="4px" />
          </div>
        }
      </div>
    </div>
  }
</div>
