@if (visible()) {
  <div class="preloader__inner" role="status" aria-live="polite">
    <p-progress-spinner
      [strokeWidth]="strokeWidth()"
      animationDuration=".8s"
      aria-label="Загрузка"
    />

    @if (label()) {
      <span class="preloader__label">{{ label() }}</span>
    }
  </div>
}
