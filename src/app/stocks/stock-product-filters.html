<button
  class="button filter-trigger"
  type="button"
  aria-haspopup="dialog"
  [attr.aria-expanded]="opened()"
  (click)="opened.set(true)"
>
  <app-icon name="filter" />Фильтры
  @if (activeCount()) {
    <span class="filter-count">{{ activeCount() }}</span>
  }
</button>
@if (opened()) {
  <dialog
    #drawer
    class="stock-filter-panel"
    aria-label="Фильтры товаров"
    appModalFocus
    (modalEscape)="close()"
    (cancel)="$event.preventDefault(); close()"
    (click)="backdrop($event)"
  >
    <header>
      <div>
        <h2>Фильтры</h2>
        <p>Категория, тип Фин и характеристики товара</p>
      </div>
      <button type="button" aria-label="Закрыть фильтры товаров" (click)="close()">×</button>
    </header>
    <div class="stock-filter-grid">
      <label
        >Номенклатура
        <select
          aria-label="Условие поиска номенклатуры"
          [ngModel]="nameOperator()"
          (ngModelChange)="textChanged.emit({ field: 'nameOperator', value: $event })"
        >
          <option value="contains">Содержит</option>
          <option value="not_contains">Не содержит</option>
        </select>
        <input
          type="search"
          aria-label="Номенклатура"
          placeholder="Название товара"
          [ngModel]="name()"
          (ngModelChange)="textChanged.emit({ field: 'name', value: $event })"
          (keydown.enter)="done()"
        />
      </label>
      <label
        >Артикул
        <select
          aria-label="Условие поиска артикула"
          [ngModel]="articleOperator()"
          (ngModelChange)="textChanged.emit({ field: 'articleOperator', value: $event })"
        >
          <option value="contains">Содержит</option>
          <option value="not_contains">Не содержит</option>
        </select>
        <input
          type="search"
          aria-label="Артикул"
          placeholder="Артикул, SKU маркетплейса или 1С"
          [ngModel]="article()"
          (ngModelChange)="textChanged.emit({ field: 'article', value: $event })"
          (keydown.enter)="done()"
        />
      </label>
      @for (field of fields(); track field[0]) {
        <app-stock-choice
          [roomy]="true"
          [label]="field[1]"
          [options]="choices()[field[0]] || []"
          [values]="values()[field[0]] || []"
          (valuesChange)="filterChanged.emit({ key: field[0], values: $event })"
        />
      }
    </div>
    <footer>
      <button class="button" type="button" (click)="filtersReset.emit()">Сбросить фильтры</button>
      <button class="button" type="button" (click)="clearProducts()" [disabled]="!selected()">
        Снять выбор
      </button>
      <button class="button" type="button" (click)="selectProducts()" [disabled]="busy()">
        Выбрать найденные
      </button>
      <button class="button primary" type="button" (click)="done()">Готово</button>
    </footer>
  </dialog>
}
