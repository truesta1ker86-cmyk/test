<form class="operational-filters filter-bar" (ngSubmit)="applyFilter()">
  @if (entity === 'orders') {
    <app-filter-select
      key="lifecycle"
      label="Жизненный цикл"
      [options]="lifecycles"
      [(ngModel)]="lifecycle"
      name="lifecycle"
      (userChange)="status = ''; applyFilter()"
    />
    <app-filter-select
      key="status"
      label="Статус"
      [options]="statuses"
      [(ngModel)]="status"
      name="status"
      (userChange)="applyFilter()"
    />
    <app-filter-select
      key="scheme"
      label="Схема"
      [options]="schemes"
      [(ngModel)]="scheme"
      name="scheme"
      (userChange)="applyFilter()"
    />
  }
  <app-filter-text
    key="search"
    label="Поиск"
    placeholder="Номер, артикул…"
    [(ngModel)]="search"
    name="search"
  />
  <app-filter-select
    key="sort"
    label="Порядок"
    [options]="entity === 'orders' ? sorts : returnSorts"
    [(ngModel)]="sort"
    name="sort"
    (userChange)="applyFilter()"
  />
  <button class="button primary" type="submit" [disabled]="loading">Применить</button
  ><button class="button" type="button" (click)="resetFilter()">Сбросить</button>
</form>
