<app-progress></app-progress> 

<div class="products-page">  
    <!-- ============================================================
         Идёт синхронизация — блокируем редактирование
         ============================================================ -->
    @if (pageState() === 'ready' && !canEdit()) {
      <div class="edit-lock-banner">
        🔒 {{ lockReason() }} Редактирование временно недоступно.
      </div>
    }
  
    <!-- ============================================================
         Контент страницы
         ============================================================ -->
    <div class="page-content" [class.locked]="!canEdit()">
  
      <h2>Карточки товаров</h2>
  
  
    </div>
  
  </div>
